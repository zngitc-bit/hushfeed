name: Test and package extension

# Test every change to main and every pull request. Publish tagged versions
# only after their own tests pass.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run browser regression tests
        shell: bash
        run: python -u tests/e2e.py 2>&1 | tee test-results.log

      - name: Save test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results.log
          if-no-files-found: ignore
          retention-days: 14

  package:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION=$(jq -r .version extension/manifest.json)
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match manifest version $MANIFEST_VERSION"
            exit 1
          fi

      - name: Build zip
        run: bash scripts/build.sh

      - name: Extract release notes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          version = json.loads(Path('extension/manifest.json').read_text())['version']
          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8')
          notes = changelog.split(f'## {version}\n', 1)[1].split('\n## ', 1)[0].strip()
          if not notes:
              raise SystemExit('Missing release notes')
          Path('dist/release-notes.md').write_text(notes + '\n', encoding='utf-8')
          PY

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/hushfeed-*.zip
          body_path: dist/release-notes.md
          fail_on_unmatched_files: true
